<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Janet Benchmarks Dashboard</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #181b23;
    --surface-2: #20242f;
    --border: #2c3140;
    --text: #e6e9ef;
    --muted: #8b92a5;
    --accent: #6ea8fe;
    --good: #4ade80;
    --bad: #f87171;
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    line-height: 1.45;
  }
  .container {
    max-width: 1320px;
    margin: 0 auto;
    padding: 24px 20px 48px;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 20px;
  }
  h1 {
    margin: 0;
    font-size: 1.5rem;
    font-weight: 650;
    letter-spacing: -0.01em;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.9rem;
    margin-top: 2px;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }
  .btn, select {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 0.85rem;
    cursor: pointer;
    font-family: var(--sans);
  }
  .btn:hover, select:hover {
    border-color: var(--accent);
  }
  .btn.active {
    background: rgba(110, 168, 254, 0.16);
    border-color: var(--accent);
    color: var(--accent);
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 18px;
  }
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 18px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .stat-label {
    font-size: 0.78rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .stat-value {
    font-size: 1.25rem;
    font-weight: 650;
    font-family: var(--mono);
    margin-top: 4px;
  }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
  }
  .legend-item {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    font-size: 0.8rem;
    font-family: var(--mono);
    cursor: pointer;
    user-select: none;
    transition: opacity 0.15s;
  }
  .legend-item.off {
    opacity: 0.38;
  }
  .legend-swatch {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .chart-wrap {
    position: relative;
    width: 100%;
    overflow-x: auto;
  }
  svg.chart {
    display: block;
    width: 100%;
    min-width: 720px;
    height: auto;
    font-family: var(--mono);
  }
  .tooltip {
    position: fixed;
    pointer-events: none;
    background: #11131a;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 11px;
    font-size: 0.8rem;
    font-family: var(--mono);
    color: var(--text);
    box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    z-index: 100;
    display: none;
    white-space: nowrap;
  }
  .table-wrap {
    overflow-x: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.84rem;
    font-family: var(--mono);
  }
  th, td {
    text-align: left;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
  }
  th {
    color: var(--muted);
    font-weight: 600;
    cursor: pointer;
    user-select: none;
  }
  th:hover {
    color: var(--text);
  }
  td.num, th.num {
    text-align: right;
  }
  .delta-good { color: var(--good); }
  .delta-bad { color: var(--bad); }
  .empty-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--muted);
  }
  .drop-hint {
    font-size: 0.8rem;
    color: var(--muted);
  }
  input[type="file"] { display: none; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>Janet Benchmarks</h1>
      <div class="subtitle">Execution time (min / mean / max) across Janet versions</div>
    </div>
    <div class="controls">
      <button class="btn active" id="btnLog">Log₁₀ Scale</button>
      <button class="btn" id="btnLinear">Linear Scale</button>
      <select id="baselineSelect" title="Baseline version for relative comparison"></select>
      <label class="btn" for="fileInput">Load .dat</label>
      <input type="file" id="fileInput" accept=".dat,.txt">
    </div>
  </header>

  <div class="stats-grid" id="statsGrid"></div>

  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:10px;">
      <div class="legend" id="legend"></div>
      <div style="display:flex; gap:6px;">
        <button class="btn" id="btnAll">All</button>
        <button class="btn" id="btnNone">None</button>
      </div>
    </div>
    <div class="chart-wrap" id="chartWrap"></div>
  </div>

  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <strong>Benchmark Results</strong>
      <span class="drop-hint">Tip: drag &amp; drop a <code>report.dat</code> file anywhere on this page</span>
    </div>
    <div class="table-wrap" id="tableWrap"></div>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>

const PALETTE = [
  "#6ea8fe", "#f59e0b", "#4ade80", "#f472b6", "#a78bfa",
  "#2dd4bf", "#fb7185", "#facc15", "#38bdf8", "#c084fc"
];

let state = {
  data: BENCHMARK_DATA,
  scale: "log",
  hiddenVersions: new Set(),
  baseline: null,
  sortKey: "benchmark",
  sortAsc: true
};

function parseDatText(text) {
  const rows = [];
  for (const rawLine of text.split(/\r?\n/)) {
    const line = rawLine.trim();
    if (!line || line.startsWith("#")) continue;
    const parts = line.split("\t");
    if (parts.length < 6) continue;
    const [version, idxStr, benchmark, minStr, maxStr, meanStr] = parts;
    const min = parseFloat(minStr);
    const max = parseFloat(maxStr);
    const mean = parseFloat(meanStr);
    if (!Number.isFinite(min) || !Number.isFinite(max) || !Number.isFinite(mean)) continue;
    rows.push({
      version,
      index: parseInt(idxStr, 10) || 0,
      benchmark,
      min,
      max,
      mean
    });
  }
  return rows;
}

function formatTime(sec) {
  if (sec < 0.001) return (sec * 1e6).toFixed(1) + " µs";
  if (sec < 1) return (sec * 1000).toFixed(2) + " ms";
  return sec.toFixed(3) + " s";
}

function getVersions(data) {
  const seen = [];
  for (const r of data) {
    if (!seen.includes(r.version)) seen.push(r.version);
  }
  return seen;
}

function getBenchmarks(data) {
  const map = new Map();
  for (const r of data) {
    if (!map.has(r.benchmark)) map.set(r.benchmark, r.index);
  }
  return Array.from(map.entries())
    .sort((a, b) => a[1] - b[1] || a[0].localeCompare(b[0]))
    .map(([name]) => name);
}

function renderStats(versions, benchmarks) {
  const grid = document.getElementById("statsGrid");
  const visibleCount = versions.filter(v => !state.hiddenVersions.has(v)).length;
  grid.innerHTML = `
    <div class="stat-card"><div class="stat-label">Versions</div><div class="stat-value">${visibleCount} / ${versions.length}</div></div>
    <div class="stat-card"><div class="stat-label">Benchmarks</div><div class="stat-value">${benchmarks.length}</div></div>
    <div class="stat-card"><div class="stat-label">Data Points</div><div class="stat-value">${state.data.length}</div></div>
    <div class="stat-card"><div class="stat-label">Baseline</div><div class="stat-value" style="font-size:1rem">${state.baseline || "—"}</div></div>
  `;
}

function renderLegend(versions) {
  const el = document.getElementById("legend");
  el.innerHTML = "";
  versions.forEach((ver, i) => {
    const item = document.createElement("div");
    item.className = "legend-item" + (state.hiddenVersions.has(ver) ? " off" : "");
    const color = PALETTE[i % PALETTE.length];
    item.innerHTML = `<span class="legend-swatch" style="background:${color}"></span><span>${ver}</span>`;
    item.onclick = () => {
      if (state.hiddenVersions.has(ver)) state.hiddenVersions.delete(ver);
      else state.hiddenVersions.add(ver);
      render();
    };
    el.appendChild(item);
  });
}

function renderBaselineSelect(versions) {
  const sel = document.getElementById("baselineSelect");
  if (!state.baseline || !versions.includes(state.baseline)) {
    state.baseline = versions[0] || null;
  }
  sel.innerHTML = versions.map(v =>
    `<option value="${v}" ${v === state.baseline ? "selected" : ""}>Baseline: ${v}</option>`
  ).join("");
}

function renderChart(versions, benchmarks) {
  const wrap = document.getElementById("chartWrap");
  const visibleVersions = versions.filter(v => !state.hiddenVersions.has(v));
  const filtered = state.data.filter(d => !state.hiddenVersions.has(d.version));

  if (!filtered.length || !benchmarks.length) {
    wrap.innerHTML = `<div class="empty-state">No data to display. Load a <code>report.dat</code> file or enable at least one version.</div>`;
    return;
  }

  const rowH = Math.max(38, visibleVersions.length * 10 + 18);
  const pad = { top: 24, right: 28, bottom: 42, left: 195 };
  const width = 980;
  const height = pad.top + pad.bottom + benchmarks.length * rowH;
  const plotW = width - pad.left - pad.right;

  let minVal = Infinity, maxVal = -Infinity;
  for (const d of filtered) {
    if (d.min < minVal) minVal = d.min;
    if (d.max > maxVal) maxVal = d.max;
  }

  const isLog = state.scale === "log";
  const xMin = isLog ? Math.pow(10, Math.floor(Math.log10(Math.max(minVal, 1e-6)))) : 0;
  const xMax = isLog ? Math.pow(10, Math.ceil(Math.log10(maxVal))) : maxVal * 1.08;

  const xScale = (val) => {
    if (isLog) {
      const lMin = Math.log10(xMin);
      const lMax = Math.log10(xMax);
      const lVal = Math.log10(Math.max(val, xMin));
      return pad.left + ((lVal - lMin) / (lMax - lMin || 1)) * plotW;
    }
    return pad.left + (val / (xMax || 1)) * plotW;
  };

  let ticks = [];
  if (isLog) {
    const pMin = Math.floor(Math.log10(xMin));
    const pMax = Math.ceil(Math.log10(xMax));
    for (let p = pMin; p <= pMax; p++) ticks.push(Math.pow(10, p));
  } else {
    const steps = 5;
    for (let i = 0; i <= steps; i++) ticks.push((xMax / steps) * i);
  }

  let svg = `<svg class="chart" viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg">`;

  // Vertical gridlines & x-axis ticks
  for (const t of ticks) {
    const x = xScale(t);
    svg += `<line x1="${x}" y1="${pad.top}" x2="${x}" y2="${height - pad.bottom}" stroke="#262b38" stroke-width="1"/>`;
    const label = isLog ? (t >= 1 ? t + "s" : (t * 1000) + "ms") : formatTime(t);
    svg += `<text x="${x}" y="${height - pad.bottom + 18}" fill="#8b92a5" font-size="11" text-anchor="middle">${label}</text>`;
  }
  svg += `<text x="${pad.left + plotW / 2}" y="${height - 8}" fill="#8b92a5" font-size="11" text-anchor="middle">Elapsed Time (${isLog ? "log₁₀" : "linear"})</text>`;

  // Horizontal benchmark bands & labels
  benchmarks.forEach((b, bi) => {
    const yTop = pad.top + bi * rowH;
    const yMid = yTop + rowH / 2;
    if (bi % 2 === 1) {
      svg += `<rect x="${pad.left}" y="${yTop}" width="${plotW}" height="${rowH}" fill="rgba(255,255,255,0.015)"/>`;
    }
    svg += `<line x1="${pad.left}" y1="${yTop + rowH}" x2="${width - pad.right}" y2="${yTop + rowH}" stroke="#222633" stroke-width="1"/>`;
    svg += `<text x="${pad.left - 10}" y="${yMid + 4}" fill="#e6e9ef" font-size="12" text-anchor="end">${b}</text>`;
  });

  // Data series
  const nVis = visibleVersions.length;
  visibleVersions.forEach((ver, vi) => {
    const color = PALETTE[versions.indexOf(ver) % PALETTE.length];
    const offset = nVis > 1 ? ((vi / (nVis - 1)) - 0.5) * Math.min(rowH * 0.68, nVis * 9) : 0;

    benchmarks.forEach((b, bi) => {
      const d = filtered.find(r => r.version === ver && r.benchmark === b);
      if (!d) return;
      const y = pad.top + bi * rowH + rowH / 2 + offset;
      const x1 = xScale(d.min);
      const x2 = xScale(d.max);
      const xm = xScale(d.mean);

      svg += `<g class="pt" data-ver="${ver}" data-bench="${b}" data-min="${d.min}" data-mean="${d.mean}" data-max="${d.max}">`;
      svg += `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${color}" stroke-width="2" stroke-opacity="0.8"/>`;
      svg += `<line x1="${x1}" y1="${y - 3.5}" x2="${x1}" y2="${y + 3.5}" stroke="${color}" stroke-width="1.5"/>`;
      svg += `<line x1="${x2}" y1="${y - 3.5}" x2="${x2}" y2="${y + 3.5}" stroke="${color}" stroke-width="1.5"/>`;
      svg += `<circle cx="${xm}" cy="${y}" r="4" fill="${color}" stroke="#0f1117" stroke-width="1"/>`;
      svg += `<rect x="${Math.min(x1, xm) - 4}" y="${y - 6}" width="${Math.max(8, Math.abs(x2 - x1) + 8)}" height="12" fill="transparent"/>`;
      svg += `</g>`;
    });
  });

  svg += `</svg>`;
  wrap.innerHTML = svg;

  const tooltip = document.getElementById("tooltip");
  wrap.querySelectorAll(".pt").forEach(el => {
    el.addEventListener("mouseenter", (e) => {
      const { ver, bench, min, mean, max } = el.dataset;
      const base = state.data.find(r => r.version === state.baseline && r.benchmark === bench);
      let relHtml = "";
      if (base && ver !== state.baseline) {
        const ratio = parseFloat(mean) / base.mean;
        const cls = ratio <= 1 ? "delta-good" : "delta-bad";
        const label = ratio <= 1 ? `${(1 / ratio).toFixed(2)}× faster` : `${ratio.toFixed(2)}× slower`;
        relHtml = `<div class="${cls}">vs ${state.baseline}: ${label}</div>`;
      }
      tooltip.innerHTML = `
        <div style="font-weight:700; margin-bottom:4px;">${bench} — ${ver}</div>
        <div>mean: ${formatTime(parseFloat(mean))}</div>
        <div>min:  ${formatTime(parseFloat(min))}</div>
        <div>max:  ${formatTime(parseFloat(max))}</div>
        ${relHtml}
      `;
      tooltip.style.display = "block";
    });
    el.addEventListener("mousemove", (e) => {
      tooltip.style.left = (e.clientX + 14) + "px";
      tooltip.style.top = (e.clientY + 14) + "px";
    });
    el.addEventListener("mouseleave", () => {
      tooltip.style.display = "none";
    });
  });
}

function renderTable() {
  const wrap = document.getElementById("tableWrap");
  const rows = state.data
    .filter(d => !state.hiddenVersions.has(d.version))
    .map(d => {
      const base = state.data.find(r => r.version === state.baseline && r.benchmark === d.benchmark);
      const ratio = base ? d.mean / base.mean : null;
      return { ...d, ratio };
    });

  rows.sort((a, b) => {
    const k = state.sortKey;
    const va = a[k] ?? 0;
    const vb = b[k] ?? 0;
    const cmp = typeof va === "string" ? va.localeCompare(vb) : va - vb;
    return state.sortAsc ? cmp : -cmp;
  });

  const cols = [
    ["benchmark", "Benchmark", false],
    ["version", "Version", false],
    ["min", "Min", true],
    ["mean", "Mean", true],
    ["max", "Max", true],
    ["ratio", `vs ${state.baseline || "Baseline"}`, true]
  ];

  let html = `<table><thead><tr>`;
  for (const [key, label, isNum] of cols) {
    const arrow = state.sortKey === key ? (state.sortAsc ? " ▲" : " ▼") : "";
    html += `<th class="${isNum ? "num" : ""}" data-key="${key}">${label}${arrow}</th>`;
  }
  html += `</tr></thead><tbody>`;

  for (const r of rows) {
    let ratioCell = "—";
    if (r.ratio !== null) {
      if (r.version === state.baseline) {
        ratioCell = `<span style="color:var(--muted)">1.00×</span>`;
      } else {
        const cls = r.ratio <= 1 ? "delta-good" : "delta-bad";
        ratioCell = `<span class="${cls}">${r.ratio.toFixed(2)}×</span>`;
      }
    }
    html += `<tr>
      <td>${r.benchmark}</td>
      <td>${r.version}</td>
      <td class="num">${formatTime(r.min)}</td>
      <td class="num">${formatTime(r.mean)}</td>
      <td class="num">${formatTime(r.max)}</td>
      <td class="num">${ratioCell}</td>
    </tr>`;
  }
  html += `</tbody></table>`;
  wrap.innerHTML = html;

  wrap.querySelectorAll("th").forEach(th => {
    th.onclick = () => {
      const k = th.dataset.key;
      if (state.sortKey === k) state.sortAsc = !state.sortAsc;
      else { state.sortKey = k; state.sortAsc = true; }
      renderTable();
    };
  });
}

function render() {
  const versions = getVersions(state.data);
  const benchmarks = getBenchmarks(state.data);
  renderBaselineSelect(versions);
  renderStats(versions, benchmarks);
  renderLegend(versions);
  renderChart(versions, benchmarks);
  renderTable();
}

document.getElementById("btnLog").onclick = () => {
  state.scale = "log";
  document.getElementById("btnLog").classList.add("active");
  document.getElementById("btnLinear").classList.remove("active");
  render();
};
document.getElementById("btnLinear").onclick = () => {
  state.scale = "linear";
  document.getElementById("btnLinear").classList.add("active");
  document.getElementById("btnLog").classList.remove("active");
  render();
};
document.getElementById("baselineSelect").onchange = (e) => {
  state.baseline = e.target.value;
  render();
};
document.getElementById("btnAll").onclick = () => {
  state.hiddenVersions.clear();
  render();
};
document.getElementById("btnNone").onclick = () => {
  getVersions(state.data).forEach(v => state.hiddenVersions.add(v));
  render();
};

function loadDatFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    state.data = parseDatText(reader.result);
    state.hiddenVersions.clear();
    render();
  };
  reader.readAsText(file);
}

document.getElementById("fileInput").onchange = (e) => {
  if (e.target.files[0]) loadDatFile(e.target.files[0]);
};
document.body.addEventListener("dragover", (e) => e.preventDefault());
document.body.addEventListener("drop", (e) => {
  e.preventDefault();
  if (e.dataTransfer.files[0]) loadDatFile(e.dataTransfer.files[0]);
});

render();
</script>
</body>
</html>
